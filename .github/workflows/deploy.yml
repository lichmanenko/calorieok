name: Build and publish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Публикация: собранный dist -> ветка deploy (GitHub Pages читает её корень)
      - name: Deploy dist to branch `deploy`
        env:
          GITHUB_SHA_SHORT: ${{ github.sha }}
        run: |
          cd dist
          git init -q
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add -A
          git commit -qm "deploy ${GITHUB_SHA_SHORT:0:7}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:deploy
