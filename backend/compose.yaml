# Deep Dish sync — HTTPS (TLS) на ваш IP: сертификаты в папке data/ (server.crt, server.key).
# Файлы рядом: server.py, requirements.txt, data/server.crt, data/server.key
services:
  deepdish-sync:
    image: python:3.12-slim
    container_name: deepdish-sync
    restart: unless-stopped
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -q -r /app/requirements.txt && exec uvicorn server:app --host 0.0.0.0 --port 8687 --ssl-certfile /data/server.crt --ssl-keyfile /data/server.key"
    ports:
      - "8687:8687"
    volumes:
      - /share/Container/deepdish/backend:/app
      - /share/Container/deepdish/backend/data:/data
      - pip-cache:/root/.cache/pip
    environment:
      - DD_DB=/data/deepdish.db

volumes:
  pip-cache:
